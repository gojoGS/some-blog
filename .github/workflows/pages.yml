name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install asciidoctor
        run: gem install asciidoctor rouge

      - name: Build site
        run: |
          asciidoctor -a source-highlighter=rouge -D dist/html -T templates -b html content/*.adoc
          cp style.css dist/html/
          cp rouge.css dist/html/
          cp favicon.ico dist/html/
          cp -r fonts dist/html/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/html

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
